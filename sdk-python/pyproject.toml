[project]
name = "latticeag-vekrevert"
version = "0.2.0"
description = "VekRevert Python SDK - compensating transactions for agent side effects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LatticeAG" }]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "conformance: cross-language frozen vector tests",
]
