[project]
name = "latticeag-vekrevert"
version = "0.5.0"
description = "VekRevert Python SDK - compensating transactions for agent side effects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LatticeAG" }]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
# Floor: setuptools >= 68 reads the PEP 621 [project] table and provides the
# PEP 660 build_editable hook used by `pip install -e`. Older setuptools
# ignore [project] and silently build UNKNOWN-0.0.0 — setup.py carries a
# loud floor check for ambient-env builds (e.g. --no-build-isolation).
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "conformance: cross-language frozen vector tests",
]
